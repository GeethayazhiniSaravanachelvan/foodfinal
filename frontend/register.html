<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Foodshare – Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/></svg>
        </div>
        <span>Foodshare</span>
      </a>
      <div class="nav-actions">
        <span style="font-size: 0.9rem; color: var(--text-muted);">Already registered?</span>
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join the Foodshare surplus food redistribution network</p>
      </div>

      <!-- Role Selection -->
      <div class="role-selector" id="reg-role-selector">
        <button type="button" class="role-tab-btn active" data-role="donor">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Food Donor
        </button>
        <button type="button" class="role-tab-btn" data-role="recipient">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Food Recipient
        </button>
      </div>

      <div id="auth-error-banner" class="alert-banner alert-danger" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="auth-error-text">Registration error</span>
      </div>

      <form id="register-form">
        <!-- Name & Organization -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Maria Vance" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-org">Organization <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">(Optional)</span></label>
            <input type="text" id="reg-org" class="form-control" placeholder="e.g. Green Bakery" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required />
        </div>

        <!-- Password & Confirm -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required />
          </div>
        </div>

        <!-- Address (Optional) -->
        <div class="form-group">
          <label class="form-label" for="reg-address">City or Address <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">(Optional)</span></label>
          <input type="text" id="reg-address" class="form-control" placeholder="e.g. Downtown, New York" />
          <input type="hidden" id="reg-lat" value="40.7397" />
          <input type="hidden" id="reg-lng" value="-73.9918" />
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Complete Registration
        </button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let currentRole = 'donor';

    document.addEventListener('DOMContentLoaded', () => {
      window.FOODSHARE_AUTH.redirectIfLoggedIn();

      // Check URL param ?role=recipient
      const urlParams = new URLSearchParams(window.location.search);
      const urlRole = urlParams.get('role');
      if (urlRole === 'recipient') {
        setRole('recipient');
      }

      // Role switcher
      const roleBtns = document.querySelectorAll('.role-tab-btn');
      roleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          setRole(btn.dataset.role);
        });
      });

      function setRole(role) {
        currentRole = role;
        roleBtns.forEach(b => {
          if (b.dataset.role === role) b.classList.add('active');
          else b.classList.remove('active');
        });
      }

      // Form submit
      const form = document.getElementById('register-form');
      const errorBanner = document.getElementById('auth-error-banner');
      const errorText = document.getElementById('auth-error-text');
      const submitBtn = document.getElementById('reg-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.style.display = 'none';

        const name = document.getElementById('reg-name').value.trim();
        const organization = document.getElementById('reg-org').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;
        const address = document.getElementById('reg-address').value.trim();
        const lat = parseFloat(document.getElementById('reg-lat')?.value || '40.7397');
        const lng = parseFloat(document.getElementById('reg-lng')?.value || '-73.9918');

        if (password !== confirmPass) {
          errorText.textContent = 'Passwords do not match.';
          errorBanner.style.display = 'flex';
          return;
        }

        const payload = {
          name,
          organization,
          email,
          phone: '',
          password,
          role: currentRole,
          address,
          lat,
          lng,
          dietaryPreferences: [],
          allergies: [],
          householdSize: 4,
          storageCapacity: 'all',
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner"></span> Creating account...`;

        try {
          const user = await window.FOODSHARE_AUTH.register(payload);
          window.FOODSHARE_UI.showToast('Registration Complete!', 'Welcome to Foodshare.', 'success');

          setTimeout(() => {
            if (user.role === 'donor') {
              window.location.href = 'donor-dashboard.html';
            } else {
              window.location.href = 'recipient-dashboard.html';
            }
          }, 400);
        } catch (err) {
          errorText.textContent = err.message || 'Registration failed. Please verify your information.';
          errorBanner.style.display = 'flex';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Complete Registration';
        }
      });
    });
  </script>
</body>
</html>
